  model_technical_metadata:
    class: _metadata
    extensions:
      - glb
      - gltf
      - obj
      - nxs
      - nxz
    description: extract technical metadata from 3D models (Draco compression status)
    metadata:
      - file: "technical_metadata.json"
    execs:
      - service: node
        commands:
          - prog: node
            args:
              - "%_exec.pluginDir%/src/server/recipe/extractMetadata.js"
              - type: file_in
                file:
                  url: "%_source.url%"
                  name: "%_source.generatedname%"
              - type: file_out
                file:
                  name: "technical_metadata.json"
  model2viewer:
    class: vector3d
    produceclass: vector3d
    extensions:
      - glb
      - gltf
      - obj
    description: convert and compress a model into the single viewer glb
    execs:
      - match: {}
        service: node
        timeoutSec: 0
        extension: "glb"
        commands:
          - prog: node
            args:
              - "%_exec.pluginDir%/src/server/recipe/model2viewer.js"
              - "%info.json%"
              - "%_source.url%"
              - type: file_in
                file:
                  url: "%_source.url%"
                  name: "%_source.generatedname%"
              - type: file_out
                file:
                  url: "%_target.url%"
                  name: "model.glb"
  model2viewer_nexus:
    class: vector3d
    produceclass: vector3d
    extensions:
      - nxs
      - nxz
    description: forward a Nexus model into the viewer nxz path
    execs:
      - match: {}
        service: node
        timeoutSec: 0
        extension: "nxz"
        commands:
          - prog: node
            args:
              - "%_exec.pluginDir%/src/server/recipe/model2viewer.js"
              - "%info.json%"
              - "%_source.url%"
              - type: file_in
                file:
                  url: "%_source.url%"
                  name: "%_source.generatedname%"
              - type: file_out
                file:
                  url: "%_target.url%"
                  name: "model.nxz"
  obj2glb:
    class: vector3d
    produceclass: vector3d
    extensions:
      - obj
    description: convert obj to glb
    execs:
      - match: {}
        service: node
        timeoutSec: 0
        extension: "glb"
        commands:
          - prog: node
            args:
              - "%_exec.pluginDir%/src/server/recipe/obj2glb.js"
              - "%info.json%"
              - "%_source.url%"
              - type: file_in
                file:
                  url: "%_source.url%"
                  name: "%_source.generatedname%"
              - type: file_out
                file:
                  url: "%_target.url%"
                  name: "model.glb"
  gltf2glb:
    class: vector3d
    produceclass: vector3d
    extensions:
      - gltf
    description: convert gltf to glb
    execs:
      - match: {}
        service: node
        timeoutSec: 0
        extension: "glb"
        commands:
          - prog: node
            args:
              - "%_exec.pluginDir%/src/server/recipe/gltf2glb.js"
              - "%info.json%"
              - "%_source.url%"
              - type: file_in
                file:
                  url: "%_source.url%"
                  name: "%_source.generatedname%"
              - type: file_out
                file:
                  url: "%_target.url%"
                  name: "model.glb"
  glb2draco:
    class: vector3d
    produceclass: vector3d
    extensions:
      - glb
    description: compress glb with Draco
    execs:
      - match:
          not: 
          - type: match
            match:
              any:
                - type: int
                  intrange:
                    min: 1
                  value: "%_source.technical_metadata.UBHD_3D_GLB_COMPRESSED.draco_compressed%"
        service: node
        timeoutSec: 0
        extension: "glb"
        commands:
          - prog: node
            args:
              - "%_exec.pluginDir%/src/server/recipe/glb2draco.js"
              - "%info.json%"
              - "%_source.url%"
              - type: file_in
                file:
                  url: "%_source.url%"
                  name: "%_source.generatedname%"
              - type: file_out
                file:
                  url: "%_target.url%"
                  name: "model.glb"
  model2preview:
    class: vector3d
    produceclass: image
    extensions:
      - glb
      - nxz
    description: make a preview image from a glb or nxz model
    execs:
      - match: {}
        service: node
        timeoutSec: 0
        extension: "jpg"
        commands:
          - prog: node
            args:
              - "%_exec.pluginDir%/src/server/recipe/model2preview.js"
              - "%info.json%"
              - "%_source.url%"
              - type: file_in
                file:
                  url: "%_source.url%"
                  name: "%_source.generatedname%"
              - type: file_out
                file:
                  url: "%_target.url%"
                  name: "output.jpg"
  rti2preview:
    class: vector3d
    produceclass: image
    extensions:
      - zip
    description: make a preview image from an RTI web package (info.json + plane images) inside a zip
    execs:
      - match: {}
        service: node
        timeoutSec: 0
        extension: "jpg"
        commands:
          - prog: node
            args:
              - "%_exec.pluginDir%/src/server/recipe/rti2preview.js"
              - "%info.json%"
              - "%_source.url%"
              - type: file_in
                file:
                  url: "%_source.url%"
                  name: "%_source.generatedname%"
              - type: file_out
                file:
                  url: "%_target.url%"
                  name: "output.jpg"
